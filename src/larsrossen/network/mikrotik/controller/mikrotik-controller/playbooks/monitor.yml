---
# monitor.yml — one command on a RouterOS path, such as the MLAG monitor
# (mikrotik-controller mlag-status). Reads only. Variables: conn, path, command, out_file.
- name: Run a read-only RouterOS command
  hosts: localhost
  connection: local
  gather_facts: false
  module_defaults:
    group/community.routeros.api:
      hostname: "{{ conn.hostname }}"
      username: "{{ conn.username }}"
      password: "{{ conn.password }}"
      tls: "{{ conn.tls }}"
      port: "{{ conn.port | default(omit) }}"
      validate_certs: "{{ conn.validate_certs }}"
      force_no_cert: "{{ conn.force_no_cert }}"
      timeout: "{{ conn.timeout }}"
  tasks:
    - name: "{{ command }} on {{ path }}"
      community.routeros.api:
        path: "{{ path }}"
        cmd: "{{ command }}"
      register: mon
      failed_when: false
    - name: Write the answer
      ansible.builtin.copy:
        content: '{{ {"result": mon.msg | default([]), "failed": mon.failed | default(false)} | to_json }}'
        dest: "{{ out_file }}"
        mode: "0600"
