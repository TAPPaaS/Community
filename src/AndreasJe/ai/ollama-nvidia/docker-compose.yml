# TAPPaaS Module: ollama-nvidia — reference compose file
#
# Deploy to: /opt/ollama/docker-compose.yml inside the LXC container
# (update.sh writes this same content there if the file doesn't exist yet —
# keep the two in sync when editing).
#
# Requires nvidia-container-toolkit configured for Docker inside the LXC
# (`nvidia-ctk runtime configure --runtime=docker`, done by update.sh's
# bootstrap step) — the `deploy.resources.reservations.devices` stanza below
# is NVIDIA's documented Compose GPU-reservation syntax and works with plain
# `docker compose up`, no Swarm required.
#
# Unlike vllm-amd (one model baked into --model at container start), Ollama
# serves models dynamically — no model path to edit here before first start.
services:
  ollama:
    # Pinned, not :latest. An unpinned tag means a `docker compose pull` can
    # swap the inference engine under a working GPU stack without anyone
    # choosing to — and a CUDA/driver mismatch here degrades silently to CPU
    # rather than failing loudly. Bump deliberately, then re-run test.sh.
    image: ollama/ollama:0.32.2
    container_name: ollama
    restart: unless-stopped
    volumes:
      - /opt/ollama/models:/models
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_MODELS=/models
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # Sized by VRAM, not by host RAM. The earlier "RAM-rich host" reasoning
      # was measuring the wrong resource: a model is only fast while its weights
      # sit in the GPU's 12.3 GB, and Ollama does NOT refuse a model that no
      # longer fits — it silently splits it across GPU and CPU, which looks like
      # the service simply got slow. Four models pinned for 24h cannot coexist
      # in that VRAM (mistral-nemo:12b alone is 7.5 GB), so the generous
      # defaults guaranteed the silent-fallback state rather than preventing it.
      #
      # One model at a time, released after 30m idle: a shared dev box then
      # self-heals — whoever asks next reloads their model into a clear GPU and
      # pays a few seconds of load instead of inheriting someone else's
      # half-offloaded session. test.sh asserts a tok/s floor to catch a
      # regression here.
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
      # First load of a large hybrid-offload model reads tens of GB from disk —
      # on spinning-disk pools Ollama's default 5m load timeout can abort it
      # mid-load.
      - OLLAMA_LOAD_TIMEOUT=${OLLAMA_LOAD_TIMEOUT:-15m}
      # Tunables worth experimenting with (leave unset until verified on the
      # actual card — support and benefit vary by GPU generation):
      #   OLLAMA_FLASH_ATTENTION=1     — lower VRAM use for context; on older
      #                                  GPU generations the FA kernels may run
      #                                  without being the fast path — measure
      #                                  before keeping.
      #   OLLAMA_KV_CACHE_TYPE=q8_0    — quantized KV cache, frees VRAM for
      #                                  more GPU-resident layers; requires
      #                                  flash attention to be enabled.
      #   OLLAMA_NUM_PARALLEL=4        — concurrent request slots per model;
      #                                  raises throughput for multi-user
      #                                  LiteLLM traffic at the cost of
      #                                  context-size headroom.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  ollama-data:
