# apt-cacher-ng for TAPPaaS sites: snapshot.debian.org and Percona's
# repository only (ForceManaged refuses any other upstream). Signatures pass
# through untouched; apt in the site verifies them against the module's
# pinned keys.
CacheDir: /var/cache/apt-cacher-ng
LogDir: /var/log/apt-cacher-ng
Port: 3142
BindAddress: 0.0.0.0
Remap-snapshot: http://snapshot.debian.org ; http://snapshot.debian.org
Remap-percona: http://repo.percona.com ; http://repo.percona.com
ForceManaged: 1
PassThroughPattern: ^$
ExThreshold: 4
